<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA MILLÁN V48 - FINAL</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #ffd700; --dark: #000; --bg: #f4f4f4; --success: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 90px; }
        .header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--primary); }
        .nav-btn { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .banner { background: #1a1a1a; color: white; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--primary); margin-bottom: 15px; }
        .search-box { width: 100%; padding: 15px; border-radius: 25px; border: 1px solid #ccc; font-size: 1.1rem; text-align: center; box-sizing: border-box; outline: none; }
        .card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .price { font-size: 1.3rem; font-weight: bold; color: var(--success); }
        .yuls-btn { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; background: #000; border: 4px solid var(--primary); border-radius: 50%; color: var(--primary); font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 2000; text-align: center; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; line-height: 1; }
        .yuls-btn.active { background: red; color: white; animation: pulse 1s infinite; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 0.75rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        @keyframes pulse { 0% {transform: scale(1);} 100% {transform: scale(1.1);} }
    </style>
</head>
<body>

<header class="header">
    <div style="font-weight:900;">MILLÁN <span>DIAGNÓSTICO</span></div>
    <div style="display:flex; gap:20px;">
        <button onclick="showPage('home')" class="nav-btn"><i class="fas fa-home"></i></button>
        <button onclick="showPage('pos')" class="nav-btn"><i class="fas fa-shopping-cart"></i></button>
        <button onclick="askPin()" class="nav-btn"><i class="fas fa-user-cog"></i></button>
    </div>
</header>

<div id="home" class="page active">
    <div class="banner">
        <h3 style="margin:0; color:var(--primary)">ELECTRIPARTES MILLÁN</h3>
        <p style="font-size:0.8rem; margin:5px 0;">YULS: "¿Qué pieza buscamos?" 🎙️</p>
    </div>
    <input type="text" id="q" class="search-box" placeholder="Busca pieza o clave..." onkeyup="doSearch(this.value)">
    <div id="res" style="margin-top:15px;"></div>
</div>

<div id="pos" class="page">
    <button onclick="startScan()" style="width:100%; padding:15px; background:#000; color:#fff; border-radius:10px; font-weight:bold; margin-bottom:10px; border:none;"><i class="fas fa-camera"></i> ESCANEAR CÓDIGO</button>
    <div id="reader" style="width:100%; display:none; margin-bottom:10px;"></div>
    <div id="cart-list"></div>
    <div style="text-align:right; margin-top:15px; background:white; padding:15px; border-radius:10px;">
        <h2 id="total-txt">Total: $0</h2>
        <button onclick="imprimirTicket()" style="width:100%; padding:15px; background:var(--success); color:#fff; border:none; border-radius:10px; font-weight:bold;">IMPRIMIR TICKET</button>
    </div>
</div>

<div id="admin" class="page">
    <div style="background:white; padding:15px; border-radius:10px; margin-bottom:15px;">
        <h4>PORCENTAJE DE GANANCIA</h4>
        <input type="number" id="profit-margin" value="35" style="width:80px; padding:5px;" onchange="updateMargin()"> %
    </div>
    <h3 id="inv-total"></h3>
    <div style="overflow-x:auto;">
        <table id="admin-table">
            <thead><tr><th>Clave</th><th>Pieza</th><th>Stock</th><th>Costo</th><th>Venta</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div class="yuls-btn" id="yuls-btn" onclick="toggleYuls()">YULS<br>JEFE</div>

<script>
    let db = []; let cart = []; let margin = 35;

    // BASE DE DATOS MAESTRA CON TODAS TUS LISTAS (COT 1883, 1884, 1886)
    const MASTER_INVENTORY = [
        {c:"PC10530941US", n:"PORTA CARBON AVEO", s:2, cost:75},
        {c:"PC698309", n:"PORTA CARBON MITSUBISHI GDE", s:3, cost:75},
        {c:"B55", n:"MODULO TSURU 16V", s:1, cost:543},
        {c:"B6305NTN", n:"BALERO 6305 NTN", s:3, cost:109},
        {c:"B6203N", n:"BALERO 6203 NTN", s:10, cost:34},
        {c:"SF492", n:"SOLENOIDE PARED ACURAT", s:5, cost:195},
        {c:"A618114ASS", n:"ARMADURA NISSAN HITACHI", s:3, cost:264},
        {c:"CP1830M", n:"CABLE PLASTICO 18", s:2, cost:88},
        {c:"F9007LED4C", n:"FOCO 9007 LED", s:2, cost:253},
        {c:"052011", n:"BOCINA CLAXON VW HELLA", s:3, cost:121},
        {c:"B6304N", n:"BALERO 6304 NTN", s:3, cost:83},
        {c:"B6303NTN", n:"BALERO 6303 NTN", s:5, cost:65},
        {c:"B6201N", n:"BALERO 6201 NTN", s:10, cost:35},
        {c:"B6202N", n:"BALERO 6202 NTN", s:10, cost:45}
    ];

    function init() {
        let savedDb = localStorage.getItem('m_db_v48');
        let savedMargin = localStorage.getItem('m_margin_v48');
        if(savedMargin) margin = parseInt(savedMargin);
        if(savedDb) db = JSON.parse(savedDb);
        else { db = MASTER_INVENTORY.map(i => ({...i, p: Math.ceil(i.cost * (1 + margin/100))})); save(); }
        renderAdmin();
    }

    function save() { localStorage.setItem('m_db_v48', JSON.stringify(db)); localStorage.setItem('m_margin_v48', margin); }

    function showPage(p) { document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active')); document.getElementById(p).classList.add('active'); }

    function updateMargin() {
        margin = parseInt(document.getElementById('profit-margin').value);
        db = db.map(i => ({...i, p: Math.ceil(i.cost * (1 + margin/100))}));
        save(); renderAdmin();
    }

    function doSearch(val) {
        const r = document.getElementById('res');
        if(!val) { r.innerHTML = ""; return; }
        let f = db.filter(i => i.n.includes(val.toUpperCase()) || i.c.includes(val.toUpperCase()));
        r.innerHTML = f.map(i => `
            <div class="card">
                <div><b>${i.n}</b><br><small>Stock: ${i.s}</small></div>
                <div style="text-align:right">
                    <button style="border:none;background:none;color:blue;" onclick="window.open('https://www.google.com/search?tbm=isch&q=${i.n}+refaccion')"><i class="fab fa-google"></i></button>
                    <div class="price">$${i.p}</div>
                    <button onclick="addToCart('${i.c}')" style="background:black;color:white;border:none;padding:8px;border-radius:5px;">COBRAR</button>
                </div>
            </div>
        `).join('');
    }

    function addToCart(c) {
        let i = db.find(x => x.c === c);
        if(i && i.s > 0) { cart.push({...i}); i.s--; save(); drawCart(); }
    }

    function drawCart() {
        let t = 0;
        document.getElementById('cart-list').innerHTML = cart.map(i => { t += i.p; return `<div style="padding:10px; background:white; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between;"><span>${i.n}</span><b>$${i.p}</b></div>`; }).join('');
        document.getElementById('total-txt').innerText = "Total: $" + t;
    }

    function imprimirTicket() { if(cart.length > 0) { window.print(); cart = []; drawCart(); speak("Hecho jefe."); } }

    function renderAdmin() {
        let totalInv = 0;
        const body = document.querySelector('#admin-table tbody');
        body.innerHTML = db.map(i => { totalInv += (i.cost * i.s); return `<tr><td>${i.c}</td><td>${i.n}</td><td>${i.s}</td><td>$${i.cost}</td><td>$${i.p}</td></tr>`; }).join('');
        document.getElementById('inv-total').innerText = "Inversión Total: $" + totalInv.toLocaleString();
    }

    function askPin() { if(prompt("PIN ADMIN:") === "1234") showPage('admin'); }

    function toggleYuls() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'es-MX';
        document.getElementById('yuls-btn').classList.add('active');
        speak("¿Qué buscamos?");
        rec.onresult = (e) => {
            let msg = e.results[0][0].transcript.toLowerCase();
            if(msg.includes("imprime")) { imprimirTicket(); return; }
            let found = db.find(i => msg.includes(i.n.toLowerCase()));
            if(found) { speak(found.n + " tengo " + found.s + " pzas, cuesta " + found.p + " pesos."); doSearch(found.n); }
            else speak("No lo tengo en lista carnal.");
        };
        rec.onend = () => document.getElementById('yuls-btn').classList.remove('active');
        rec.start();
    }

    function speak(t) { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    init();
</script>
</body>
</html>
